services:
  - type: web
    name: porodicnostablo-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    envVars:
      - key: ConnectionStrings__Db
        sync: false
      - key: Supabase__Url
        sync: false
      - key: Supabase__JwtSecret
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: Cors__Origins__0
        sync: false
